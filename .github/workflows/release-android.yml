name: Build and publish SAI Voice OS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build APK and publish direct download
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SAI-Voice-OS.apk
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: SAI Voice OS - Latest Android APK
          body: |
            Latest automatically built Android APK for SAI Voice OS.
            Download SAI-Voice-OS.apk below and install it on your Android device.
            This is a debug/testing build, not a Play Store release.
          files: SAI-Voice-OS.apk
          fail_on_unmatched_files: true
          make_latest: true
